name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # bin/ imports the built lib/. Exit 0 or 1: this repo itself is `review`.
      - name: self-scan with --exit-code
        shell: bash
        run: |
          set +e
          node bin/trust-check.mjs --dir . --json --exit-code
          status=$?
          if [ "$status" -gt 1 ]; then exit "$status"; fi
